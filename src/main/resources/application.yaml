spring:
  application:
    name: waiting-service

server:
  port: 19200

internal:
  auth:
    secret: ${INTERNAL_AUTH_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}

waiting:
  activate-ratio: 0.1
  activate-scheduler-delay-ms: 10000
  expire-scheduler-delay-ms: 60000
  expire-minutes: 10
  outbox-retry-delay-ms: 30000
  outbox-max-retry: 5