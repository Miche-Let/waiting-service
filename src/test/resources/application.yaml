eureka:
  client:
    enabled: false

spring:
  cloud:
    discovery:
      enabled: false
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false   # ← 테스트 시 Flyway 비활성화

  data:
    redis:
      host: localhost
      port: 6379