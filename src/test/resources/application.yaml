spring:
  application:
    name: waiting-service  # ← 추가

  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    discovery:
      enabled: false

internal:
  auth:
    secret: test-internal-secret-key-must-be-32bytes!!

eureka:
  client:
    enabled: false